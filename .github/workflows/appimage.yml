name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build AppImage
        env:
          WXB_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x packaging/appimage/build.sh
          ./packaging/appimage/build.sh
          file dist/*.AppImage
          (cd dist && sha256sum *.AppImage > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: WXB-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attach bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.AppImage dist/SHA256SUMS --clobber
